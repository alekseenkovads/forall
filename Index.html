<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:    #f4f3f1;
    --ink:   #1a1917;
    --mid:   #5a5854;
    --muted: #9e9b96;
    --faint: #d6d3cd;
    --white: #fdfcfa;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Mono', monospace; }
  .wrapper {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px;
    text-align: center;
  }
  .container {
    max-width: 600px;
    padding: 60px 40px;
    background: var(--white);
    border: 1px solid var(--faint);
    position: relative;
  }
  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 32px;
  }
  .logo-text em { font-style: italic; color: var(--muted); }
  
  .status-tag {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--faint);
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }
  p {
    font-size: 13px;
    color: var(--mid);
    line-height: 1.8;
    margin-bottom: 32px;
  }
  .footer-meta {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    border-top: 1px solid var(--faint);
    padding-top: 24px;
    margin-top: 16px;
    text-transform: uppercase;
  }
  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00F0FF;
    margin-right: 8px;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="container">
    <div class="status-tag">// repository initialized</div>
    <div class="logo-text">Cyber<em>netica</em></div>
    <h1>Новый контекст подготовлен</h1>
    <p>Репозиторий успешно запущен. Локальный индексный файл настроен и готов к развертыванию модулей, автоматизаций или документации текущей вертикали.</p>
    <div class="footer-meta">
      <span class="dot"></span>alekseenkovads.github.io · май 2026
    </div>
  </div>
</div>

</body>
</html>
